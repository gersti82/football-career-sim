<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0b1020"><title>Football Career Simulator</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1020;color:#f7f8fb;min-height:100vh}.wrap{max-width:760px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom))}.card{background:#151b2d;border:1px solid #26304a;border-radius:18px;padding:16px;margin:12px 0}.headline{font-size:19px;font-weight:800}.muted{color:#9aa4ba}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;color:#9aa4ba;margin:9px 0 5px}input,select{width:100%;font-size:16px;border-radius:12px;border:1px solid #34415f;background:#0d1425;color:white;padding:12px}button{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:#67e8f9;color:#06212a;margin-top:10px}.secondary{background:#27324a;color:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#20283d;border-radius:13px;padding:10px;text-align:center}.stat b{display:block;font-size:19px}.stat span{font-size:11px;color:#9aa4ba}.hidden{display:none}.pill{display:inline-block;background:#24304a;border-radius:99px;padding:6px 9px;font-size:12px;margin:6px 3px 0 0}.event{border-left:3px solid #67e8f9;padding-left:10px;margin:10px 0}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:8px}.tabs button{min-width:max-content;margin:0;padding:9px 11px;font-size:13px;background:#27324a;color:#fff}.tabs button.active{background:#67e8f9;color:#06212a}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:8px 4px;border-bottom:1px solid #29334a;text-align:left}th{color:#9aa4ba}h1{font-size:25px;margin:4px 0}.sub{font-size:13px;color:#9aa4ba;margin-bottom:16px}.ok{color:#86efac}.warn{color:#fde68a}</style></head><body><div class="wrap"><h1>Football Career Simulator</h1><div class="sub">Prototype 0.2 · Germany 2016/17 · Historical mode</div><div id="dataStatus" class="card"><b>Loading historical season…</b><div class="muted">Fetching the real 2016/17 Bundesliga results.</div></div><div id="setup" class="card hidden"><div class="headline">Create player</div><div class="grid"><div><label>Name</label><input id="name" value="Chris"></div><div><label>Age</label><select id="age"><option>16</option><option>17</option><option selected>18</option><option>19</option><option>20</option></select></div><div><label>Position</label><select id="pos"><option>ST</option><option selected>AM</option><option>CM</option><option>DM</option><option>CB</option><option>FB</option><option>GK</option></select></div><div><label>Starting club</label><select id="club"><option>Bayern Munich</option><option>RB Leipzig</option><option>Borussia Dortmund</option><option>Hoffenheim</option><option>FC Cologne</option><option>Hertha Berlin</option><option selected>Freiburg</option><option>Werder Bremen</option><option>Borussia Monchengladbach</option><option>Schalke 04</option><option>Eintracht Frankfurt</option><option>Bayer Leverkusen</option><option>Augsburg</option><option>Hamburg</option><option>Mainz 05</option><option>Wolfsburg</option><option>Ingolstadt</option><option>Darmstadt 98</option></select></div></div><label>Profile</label><select id="profile"><option value="balanced">Balanced prospect</option><option value="technical">Technical / creative</option><option value="physical">Athletic</option><option value="mental">Intelligent / composed</option></select><button onclick="startCareer()">Start career</button></div><div id="game" class="hidden"><div class="card"><div id="identity" class="headline"></div><div id="clubline" class="muted"></div><div class="stats"><div class="stat"><b id="apps">0</b><span>Apps</span></div><div class="stat"><b id="mins">0</b><span>Minutes</span></div><div class="stat"><b id="grade">—</b><span>Avg Kicker grade</span></div><div class="stat"><b id="goals">0</b><span>Goals</span></div><div class="stat"><b id="assists">0</b><span>Assists</span></div><div class="stat"><b id="ability">—</b><span>Test level</span></div></div><div><span id="formP" class="pill"></span><span id="attentionP" class="pill"></span><span id="trustP" class="pill"></span></div></div><div class="card"><div class="headline">Simulate</div><div class="grid"><button onclick="advance(1)">Next match</button><button onclick="advance(5)">5 matches</button></div><button class="secondary" onclick="advance(99)">Rest of season</button><div id="latest" class="event muted">Ready.</div></div><div class="card"><div class="tabs"><button class="active" onclick="tab('matches',this)">Matches</button><button onclick="tab('market',this)">Interest</button><button onclick="tab('player',this)">Player</button></div><div id="matchesTab"></div><div id="marketTab" class="hidden"></div><div id="playerTab" class="hidden"></div></div><button class="secondary" onclick="location.reload()">New career</button></div></div><script>
const DATA='https://raw.githubusercontent.com/openfootball/deutschland/master/2016-17/1-bundesliga.txt';
const ALIAS={'Bayern München':'Bayern Munich','RB Leipzig':'RB Leipzig','Borussia Dortmund':'Borussia Dortmund','1899 Hoffenheim':'Hoffenheim','1. FC Köln':'FC Cologne','Hertha BSC':'Hertha Berlin','SC Freiburg':'Freiburg','Werder Bremen':'Werder Bremen','Bor. Mönchengladbach':'Borussia Monchengladbach','FC Schalke 04':'Schalke 04','Eintracht Frankfurt':'Eintracht Frankfurt','Bayer Leverkusen':'Bayer Leverkusen','FC Augsburg':'Augsburg','Hamburger SV':'Hamburg','1. FSV Mainz 05':'Mainz 05','VfL Wolfsburg':'Wolfsburg','FC Ingolstadt 04':'Ingolstadt','SV Darmstadt 98':'Darmstadt 98'};
const CLUBS={'Bayern Munich':[95,96,94,99,97,97,96,96,100,58],'RB Leipzig':[88,89,86,82,87,88,86,83,83,78],'Borussia Dortmund':[91,93,87,96,94,93,92,91,97,70],'Hoffenheim':[85,86,83,75,88,84,82,78,72,82],'FC Cologne':[80,80,80,78,79,78,77,74,76,76],'Hertha Berlin':[79,76,82,79,78,80,77,75,80,72],'Freiburg':[78,79,77,72,84,80,77,70,70,88],'Werder Bremen':[77,82,72,84,79,78,77,76,82,74],'Borussia Monchengladbach':[82,84,80,86,84,84,82,80,84,74],'Schalke 04':[82,80,83,91,86,87,84,83,91,70],'Eintracht Frankfurt':[78,76,80,80,81,80,77,73,78,78],'Bayer Leverkusen':[84,84,83,88,88,88,85,84,88,72],'Augsburg':[73,71,75,68,74,72,71,66,65,82],'Hamburg':[73,71,74,88,76,80,74,74,86,68],'Mainz 05':[74,74,74,70,82,79,73,68,68,84],'Wolfsburg':[76,75,77,84,83,86,80,78,82,71],'Ingolstadt':[68,66,70,58,70,67,65,61,52,87],'Darmstadt 98':[64,61,67,57,67,64,62,58,55,90]};
let FIXTURES=[],S=null;const $=x=>document.getElementById(x),clamp=(x,a=0,b=100)=>Math.max(a,Math.min(b,x)),sig=x=>1/(1+Math.exp(-x)),half=x=>Math.round(x*2)/2;
function randn(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function parseSeason(t){let md=0,out=[];for(const raw of t.split(/\r?\n/)){let m=raw.match(/Matchday\s+(\d+)/i);if(m){md=+m[1];continue}let x=raw.match(/^\s*(?:\d{1,2}:\d{2}\s+)?(.+?)\s{2,}v\s+(.+?)\s{2,}(\d+)-(\d+)(?:\s|$)/);if(!x)continue;let h=ALIAS[x[1].trim()],a=ALIAS[x[2].trim()];if(h&&a)out.push({md,home:h,away:a,hg:+x[3],ag:+x[4]})}return out}
fetch(DATA,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.text()}).then(t=>{FIXTURES=parseSeason(t);if(FIXTURES.length!==306)throw Error('Parsed '+FIXTURES.length+' matches');$('dataStatus').innerHTML='<b class="ok">Historical season loaded</b><div class="muted">306 real Bundesliga matches · 34 per club</div>';$('setup').classList.remove('hidden')}).catch(e=>{$('dataStatus').innerHTML='<b class="warn">Historical data could not load</b><div class="muted">'+e.message+'. Refresh the page and try again.</div>'});
function ability(p){let w={ST:[.45,.30,.25],AM:[.45,.20,.35],CM:[.35,.20,.45],DM:[.25,.30,.45],CB:[.20,.40,.40],FB:[.25,.40,.35],GK:[.20,.45,.35]}[p.pos]||[.34,.33,.33];return p.t*w[0]+p.ph*w[1]+p.m*w[2]}
function env(c){return c[4]*.34+c[5]*.23+c[6]*.33+c[0]*.10}
function startCareer(){let profile=$('profile').value,base=68+Math.random()*6,t=base,ph=base,m=base;if(profile==='technical'){t+=5;ph-=2;m+=2}if(profile==='physical'){ph+=5;t-=1}if(profile==='mental'){m+=5;ph-=1}let name=$('name').value||'Player',age=+$('age').value,pos=$('pos').value,club=$('club').value;S={p:{name,age,pos,t,ph,m,pot:clamp(base+13+Math.random()*11,72,96),prof:55+Math.random()*35,rep:8,att:5,fit:100,form:50,conf:50,trust:25},club,idx:0,apps:0,starts:0,mins:0,goals:0,assists:0,grades:[],hist:[],market:{}};S.fx=FIXTURES.filter(f=>f.home===club||f.away===club);$('setup').classList.add('hidden');$('dataStatus').classList.add('hidden');$('game').classList.remove('hidden');render()}
function develop(minutes,c){let p=S.p,a=p.age<=20?.24:p.age<=24?.14:p.age<=28?.05:-.025,room=Math.max(0,p.pot-ability(p)),d=a*(.45+env(c)/100*.45+Math.min(1,minutes/90)*.35)*(.55+p.prof/180)*(.25+room/35);p.t=clamp(p.t+d*.4);p.ph=clamp(p.ph+d*.25);p.m=clamp(p.m+d*.35);p.fit=clamp(p.fit+3.5)}
function marketTick(app,c){let p=S.p,perf=app?Math.max(0,4-app.grade)*9+app.goals*4+app.assists*2:0,signal=p.att*.35+p.rep*.25+perf+c[3]*.12;Object.entries(CLUBS).forEach(([name,cc])=>{if(name===S.club)return;let fit=95-Math.abs(cc[0]-ability(p))*2.3,x=signal*.34+(80-cc[7])*.15+fit*.22+randn()*8;if(!S.market[name])S.market[name]={score:0,state:'Aware'};S.market[name].score=clamp(S.market[name].score*.88+Math.max(0,x-22)*.12);let v=S.market[name].score;S.market[name].state=v>58?'Serious interest':v>42?'Interested':v>26?'Scouting':v>13?'Monitoring':'Aware'})}
function simOne(){if(S.idx>=S.fx.length)return false;let f=S.fx[S.idx++],p=S.p,c=CLUBS[S.club],home=f.home===S.club,opp=home?f.away:f.home,gf=home?f.hg:f.ag,ga=home?f.ag:f.hg,oc=CLUBS[opp]||[72,72,72,70,70,70,70,70,65,70],gap=ability(p)-c[7],score=gap*.34+(p.trust-50)*.126+(p.form-50)*.066+(p.fit-80)*.049+(p.age<=21?c[9]*.02:0)-5.5,pstart=Math.min(sig(score/3.6),clamp(30+gap*1.45+p.trust*.32+c[9]*.14+(p.form-50)*.18,3,94)/100),r=Math.random(),started=r<pstart,selected=started||r<clamp(30+gap*1.45+p.trust*.32+c[9]*.14+(p.form-50)*.18,3,94)/100;if(!selected){p.trust=clamp(p.trust-.4+Math.random()*.6);p.form=clamp(p.form-1.2+Math.random()*1.7);p.fit=clamp(p.fit+2.1);develop(0,c);S.hist.unshift({md:f.md,opp,score:gf+'–'+ga,status:'Not selected',grade:'—'});marketTick(null,c);return true}let minutes=Math.round(clamp(started?77+randn()*12:20+randn()*11,started?45:1,started?90:45)),perf=clamp(50+(ability(p)-oc[0])*.38+(c[0]-oc[0])*.11+(p.form-50)*.12+(p.conf-50)*.1+randn()*11),share=clamp((p.t+p.m)/200*(minutes/90)*.42,0,.48),goals=0,assists=0,gb={ST:1.05,AM:.62,CM:.34,FB:.14}[p.pos]||.2,ab={ST:.34,AM:.70,CM:.62,FB:.48}[p.pos]||.3;for(let i=0;i<gf;i++)if(Math.random()<share*gb*(.45+perf/150))goals++;goals=Math.min(goals,gf);for(let i=0;i<Math.max(0,gf-goals);i++)if(Math.random()<share*ab*.55)assists++;let rs=clamp(perf+(gf>ga?7:gf<ga?-7:0)+goals*9+assists*5),grade=half(clamp(6-rs/20,1,6));p.form=clamp(p.form*.78+rs*.22);p.conf=clamp(p.conf+(3.5-grade)*1.1);p.trust=clamp(p.trust+(3.5-grade)*1.5+minutes/90*.5);let q=Math.max(0,3.7-grade),ex=c[8]*(.45+oc[0]/180);p.att=clamp(p.att+ex/250*q);p.rep=clamp(p.rep+ex/500*q);p.fit=clamp(p.fit-minutes/90*(5.5+Math.random()*4));S.apps++;S.starts+=started?1:0;S.mins+=minutes;S.goals+=goals;S.assists+=assists;S.grades.push(grade);S.hist.unshift({md:f.md,opp,score:gf+'–'+ga,status:(started?'Start':'Sub')+' · '+minutes+"'",grade:grade.toFixed(1),goals,assists});develop(minutes,c);marketTick({grade,goals,assists},c);return true}
function advance(n){let count=0;while(count<n&&simOne())count++;$('latest').textContent=S.idx>=S.fx.length?'Season complete. Summer transfer window would follow in the next prototype stage.':'Processed '+count+' match'+(count===1?'':'es')+'. Next match '+(S.idx+1)+' of '+S.fx.length+'.';render()}
function level(v){return v<20?'Very low':v<35?'Low':v<55?'Moderate':v<72?'High':'Very high'}
function render(){let p=S.p,avg=S.grades.length?(S.grades.reduce((a,b)=>a+b,0)/S.grades.length).toFixed(2):'—';$('identity').textContent=p.name+' · '+p.age+' · '+p.pos;$('clubline').textContent=S.club+' · Bundesliga 2016/17';$('apps').textContent=S.apps;$('mins').textContent=S.mins;$('grade').textContent=avg;$('goals').textContent=S.goals;$('assists').textContent=S.assists;$('ability').textContent=Math.round(ability(p));$('formP').textContent='Form: '+level(p.form);$('attentionP').textContent='Attention: '+level(p.att);$('trustP').textContent='Manager: '+level(p.trust);$('matchesTab').innerHTML=S.hist.length?'<table><tr><th>MD</th><th>Opponent</th><th>Result</th><th>Role</th><th>Note</th></tr>'+S.hist.slice(0,40).map(x=>'<tr><td>'+x.md+'</td><td>'+x.opp+'</td><td>'+x.score+'</td><td>'+x.status+'</td><td>'+x.grade+'</td></tr>').join('')+'</table>':'<div class="muted">No matches yet.</div>';let m=Object.entries(S.market).filter(x=>x[1].state!=='Aware').sort((a,b)=>b[1].score-a[1].score).slice(0,12);$('marketTab').innerHTML=m.length?m.map(x=>'<div class="event"><b>'+x[0]+'</b><div class="muted">'+x[1].state+'</div></div>').join(''):'<div class="muted">No notable interest yet.</div>';$('playerTab').innerHTML='<div class="stats"><div class="stat"><b>'+p.t.toFixed(1)+'</b><span>Technical</span></div><div class="stat"><b>'+p.ph.toFixed(1)+'</b><span>Physical</span></div><div class="stat"><b>'+p.m.toFixed(1)+'</b><span>Mental</span></div></div><p class="muted">Fitness '+Math.round(p.fit)+' · Confidence '+Math.round(p.conf)+' · Reputation '+level(p.rep)+'</p>'}
function tab(which,btn){['matches','market','player'].forEach(x=>$(x+'Tab').classList.toggle('hidden',x!==which));document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}
</script></body></html>
