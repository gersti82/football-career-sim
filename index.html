<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#111827"><title>Football Career Simulator</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b1020;color:#f7f8fb;min-height:100vh}.wrap{max-width:720px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}.card{background:#151b2d;border:1px solid #26304a;border-radius:18px;padding:16px;margin:12px 0}.muted{color:#9aa4ba}.headline{font-size:19px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;color:#9aa4ba;margin:9px 0 5px}input,select{width:100%;font-size:16px;border-radius:12px;border:1px solid #34415f;background:#0d1425;color:white;padding:12px}button{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;background:#67e8f9;color:#06212a;margin-top:10px}.secondary{background:#27324a;color:#fff}.hidden{display:none}h1{font-size:25px}.sub{font-size:13px;color:#9aa4ba;margin-bottom:16px}</style></head><body><div class="wrap"><h1>Football Career Simulator</h1><div class="sub">iPhone prototype · Germany 2016/17 · Historical · build 0.1.1</div><div id="setup" class="card"><div class="headline">Create player</div><div class="grid"><div><label>Name</label><input id="name" value="Chris"></div><div><label>Age</label><select id="age"><option>16</option><option>17</option><option selected>18</option><option>19</option><option>20</option></select></div><div><label>Position</label><select id="pos"><option>ST</option><option selected>AM</option><option>CM</option><option>DM</option><option>CB</option><option>FB</option><option>GK</option></select></div><div><label>Starting club</label><select id="club"><option>Bayern Munich</option><option>RB Leipzig</option><option>Borussia Dortmund</option><option>Hoffenheim</option><option>FC Cologne</option><option>Hertha Berlin</option><option selected>Freiburg</option><option>Werder Bremen</option><option>Borussia Monchengladbach</option><option>Schalke 04</option><option>Eintracht Frankfurt</option><option>Bayer Leverkusen</option><option>Augsburg</option><option>Hamburg</option><option>Mainz 05</option><option>Wolfsburg</option><option>Ingolstadt</option><option>Darmstadt 98</option></select></div></div><label>Profile</label><select><option>Balanced prospect</option><option>Technical / creative</option><option>Athletic</option><option>Intelligent / composed</option></select><button onclick="document.getElementById('setup').innerHTML='<div class=headline>Career started</div><p>'+document.getElementById('name').value+' · '+document.getElementById('club').value+'</p><p class=muted>Hosted test is live. Full simulation engine will be restored in the next publish.</p>'">Start career</button></div></div></body></html>
