<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Football Career Simulator</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f7f8fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:800px;margin:auto;padding:18px 14px 40px}.card{background:#151b2d;border:1px solid #26304a;border-radius:18px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#20283d;border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:18px}.stat span,.muted,label{color:#9aa4ba;font-size:12px}input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #34415f;background:#0d1425;color:#fff;font-size:16px}label{display:block;margin:9px 0 5px}button{width:100%;border:0;border-radius:13px;padding:13px;margin-top:9px;font-weight:700;font-size:15px;background:#67e8f9;color:#06212a}.secondary{background:#27324a;color:#fff}.hidden{display:none}.offer{border:1px solid #34415f;border-radius:15px;padding:13px;margin:10px 0}.offer h3{margin:0 0 4px}.tag{display:inline-block;padding:5px 8px;border-radius:99px;background:#24304a;font-size:11px;margin:4px 3px 3px 0}.tabs{display:flex;gap:6px;overflow:auto}.tabs button{width:auto;white-space:nowrap;background:#27324a;color:#fff;padding:9px}.tabs .active{background:#67e8f9;color:#06212a}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:7px 3px;border-bottom:1px solid #29334a;text-align:left}.up{color:#86efac}.down{color:#fca5a5}.headline{font-size:19px;font-weight:800}.event{border-left:3px solid #67e8f9;padding-left:10px;margin:10px 0}h1{font-size:25px;margin:4px 0}.sub{color:#9aa4ba;font-size:13px}</style></head><body><div class="wrap"><h1>Football Career Simulator</h1><div class="sub">Prototype 0.4 · 2016/17 · starting contracts + debug</div><div id="setup" class="card"><div class="headline">Create player</div><div class="grid"><div><label>Name</label><input id="name" value="Chris"></div><div><label>Age</label><select id="age"><option>16</option><option>17</option><option selected>18</option><option>19</option><option>20</option></select></div><div><label>Position</label><select id="pos"><option>ST</option><option selected>AM</option><option>CM</option><option>DM</option><option>CB</option><option>FB</option><option>GK</option></select></div><div><label>Profile</label><select id="profile"><option value="balanced">Balanced prospect</option><option value="technical">Technical / creative</option><option value="physical">Athletic</option><option value="mental">Intelligent / composed</option></select></div></div><button onclick="generateOffers()">See contract offers</button></div><div id="offers" class="card hidden"></div><div id="game" class="hidden"><div class="card"><div id="identity" class="headline"></div><div id="clubline" class="muted"></div><div class="stats"><div class="stat"><b id="apps">0</b><span>Apps</span></div><div class="stat"><b id="mins">0</b><span>Minutes</span></div><div class="stat"><b id="grade">—</b><span>Kicker avg</span></div><div class="stat"><b id="goals">0</b><span>Goals</span></div><div class="stat"><b id="assists">0</b><span>Assists</span></div><div class="stat"><b id="ability">—</b><span>Ability debug</span></div></div></div><div class="card"><div class="headline">Simulate</div><div class="grid"><button onclick="advance(1)">Next match</button><button onclick="advance(5)">5 matches</button></div><button class="secondary" onclick="advance(99)">Rest of season</button><div id="latest" class="event muted">Ready.</div></div><div class="card"><div class="tabs"><button class="active" onclick="tab('matches',this)">Matches</button><button onclick="tab('market',this)">Interest debug</button><button onclick="tab('ratings',this)">Ratings debug</button><button onclick="tab('contract',this)">Contract</button></div><div id="matchesTab"></div><div id="marketTab" class="hidden"></div><div id="ratingsTab" class="hidden"></div><div id="contractTab" class="hidden"></div></div><button class="secondary" onclick="location.reload()">New career</button></div></div><script>
const CLUBS={'Bayern Munich':[96,96,100,58],'RB Leipzig':[88,83,83,78],'Borussia Dortmund':[92,91,97,70],'Hoffenheim':[85,78,72,82],'FC Cologne':[80,74,76,76],'Hertha Berlin':[79,75,80,72],'Freiburg':[78,70,70,88],'Werder Bremen':[77,76,82,74],'Borussia Monchengladbach':[83,80,84,74],'Schalke 04':[84,83,91,70],'Eintracht Frankfurt':[79,73,78,78],'Bayer Leverkusen':[85,84,88,72],'Augsburg':[73,66,65,82],'Hamburg':[74,74,86,68],'Mainz 05':[74,68,68,84],'Wolfsburg':[77,78,82,71],'Ingolstadt':[68,61,52,87],'Darmstadt 98':[64,58,55,90],'Hannover 96':[70,65,70,80],'VfB Stuttgart':[73,68,76,82],'1860 Munich':[62,58,66,86],'Nurnberg':[66,61,68,84],'Bochum':[63,58,61,83],'Kaiserslautern':[63,59,67,82]};
const HIST=['Bayern Munich','RB Leipzig','Borussia Dortmund','Hoffenheim','FC Cologne','Hertha Berlin','Freiburg','Werder Bremen','Borussia Monchengladbach','Schalke 04','Eintracht Frankfurt','Bayer Leverkusen','Augsburg','Hamburg','Mainz 05','Wolfsburg','Ingolstadt','Darmstadt 98'];let P=null,S=null,OFFERS=[];const $=x=>document.getElementById(x),clamp=(x,a=0,b=100)=>Math.max(a,Math.min(b,x));function rn(){let u=Math.random()||.1,v=Math.random()||.1;return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}function ability(){return P.t*.42+P.ph*.25+P.m*.33}function money(n){return '€'+Math.round(n/50)*50+'/week'}
function generateOffers(){let base=67+Math.random()*7,profile=$('profile').value,t=base,ph=base,m=base;if(profile==='technical'){t+=5;ph-=2;m+=2}if(profile==='physical'){ph+=5;t-=1}if(profile==='mental'){m+=5;ph-=1}P={name:$('name').value||'Player',age:+$('age').value,pos:$('pos').value,t,ph,m,pot:clamp(base+13+Math.random()*12,74,97),prof:55+Math.random()*35,form:50,conf:50,trust:25,rep:8,att:5,fit:100};let a=ability(),cands=Object.entries(CLUBS).map(([n,c])=>{let gap=a-c[1],chance=55-Math.abs(gap)*1.5+c[3]*.18+(P.age<=18?c[3]*.1:0)+rn()*12;return {n,c,score:chance}}).sort((a,b)=>b.score-a.score);let pool=cands.slice(0,11);OFFERS=[];while(OFFERS.length<4&&pool.length){let z=pool.splice(Math.floor(Math.random()*pool.length),1)[0],gap=a-z.c[1],role=gap>7?'First-team player':gap>1?'Squad player':gap>-6?'Rotation prospect':'Development prospect',minutes=role==='First-team player'?'Regular starts expected':role==='Squad player'?'Compete for regular minutes':role==='Rotation prospect'?'Cup/bench chances; earn league minutes':'No immediate first-team promise',years=P.age<=18?3:(Math.random()<.5?3:4),wage=500+z.c[2]*18+(role==='First-team player'?700:role==='Squad player'?350:0)+Math.random()*500;OFFERS.push({club:z.n,role,minutes,years,wage,expect:role==='First-team player'?'Immediate contribution':role==='Squad player'?'Push established players':role==='Rotation prospect'?'Show progress when selected':'Develop patiently'});}renderOffers();$('setup').classList.add('hidden');$('offers').classList.remove('hidden')}
function renderOffers(){$('offers').innerHTML='<div class="headline">Your offers</div><p class="muted">Same player, very different career paths. Bigger club = more exposure and development, but stronger competition.</p>'+OFFERS.map((o,i)=>'<div class="offer"><h3>'+o.club+'</h3><span class="tag">'+o.role+'</span><span class="tag">'+o.years+' years</span><span class="tag">'+money(o.wage)+'</span><p><b>Club expectation:</b> '+o.expect+'<br><b>Playing-time outlook:</b> '+o.minutes+'</p><button onclick="sign('+i+')">Sign with '+o.club+'</button></div>').join('')+'<button class="secondary" onclick="location.reload()">Regenerate player</button>'}
function sign(i){let o=OFFERS[i];S={club:o.club,contract:o,match:0,apps:0,starts:0,mins:0,goals:0,assists:0,grades:[],hist:[],market:{},prev:snap()};P.trust=o.role==='First-team player'?52:o.role==='Squad player'?40:o.role==='Rotation prospect'?30:20;$('offers').classList.add('hidden');$('game').classList.remove('hidden');render()}
function snap(){return {ability:ability(),technical:P.t,physical:P.ph,mental:P.m,potential:P.pot,professionalism:P.prof,form:P.form,confidence:P.conf,trust:P.trust,reputation:P.rep,attention:P.att,fitness:P.fit}}
function sim(){if(S.match>=34)return false;let before=snap(),c=CLUBS[S.club],gap=ability()-c[1],roleBoost={"First-team player":18,"Squad player":9,"Rotation prospect":2,"Development prospect":-7}[S.contract.role],sel=clamp(28+gap*1.8+P.trust*.42+roleBoost+(P.form-50)*.18,2,96),play=Math.random()*100<sel,started=play&&Math.random()*100<clamp(sel-12,3,88),mins=play?Math.round(clamp(started?76+rn()*13:20+rn()*10,5,90)):0,perf=play?clamp(50+gap*.45+(P.form-50)*.15+rn()*12):0,grade=play?Math.round(clamp(6-perf/20,1,6)*2)/2:null,g=play&&Math.random()<Math.max(.02,(4-grade)*.07)?1:0,as=play&&Math.random()<Math.max(.03,(4-grade)*.08)?1:0;if(play){S.apps++;S.starts+=started;S.mins+=mins;S.goals+=g;S.assists+=as;S.grades.push(grade);P.form=clamp(P.form*.78+perf*.22);P.conf=clamp(P.conf+(3.5-grade)*1.2);P.trust=clamp(P.trust+(3.5-grade)*1.55+mins/100);let exposure=c[2]/100*(mins/90)*(Math.max(0,4-grade)+g*1.2+as*.7);P.att=clamp(P.att+exposure*1.2);P.rep=clamp(P.rep+exposure*.58);P.fit=clamp(P.fit-mins/15+3)}else{P.trust=clamp(P.trust-.25+Math.random()*.4);P.form=clamp(P.form-.5+Math.random());P.fit=clamp(P.fit+3)}let room=Math.max(0,P.pot-ability()),dev=(P.age<=20?.20:.11)*(.5+c[0]/150)*(P.prof/75)*(.3+room/30)*(play?.9:.55);P.t+=dev*.4;P.ph+=dev*.25;P.m+=dev*.35;S.match++;S.hist.unshift({m:S.match,role:play?(started?'Start':'Sub'):'Not selected',mins,grade:grade?grade.toFixed(1):'—',g,as});market(grade,g,as,c);let after=snap();S.delta={};Object.keys(after).forEach(k=>S.delta[k]=after[k]-before[k]);return true}
function market(grade,g,as,c){let perf=grade?Math.max(0,4.2-grade)*11+g*6+as*3:0,signal=P.att*.45+P.rep*.3+perf+c[2]*.17;Object.entries(CLUBS).forEach(([n,cc])=>{if(n===S.club)return;let old=S.market[n]?.score||0,fit=95-Math.abs(cc[1]-ability())*2.1,x=signal*.43+(88-cc[1])*.18+fit*.25+Math.max(0,ability()+P.rep*.2+P.att*.15-cc[1]+10)*.2+rn()*7,score=clamp(old*.94+Math.max(0,x-18)*.17),state=score>42?'Serious interest':score>30?'Interested':score>18?'Scouting':score>8?'Monitoring':'Aware';S.market[n]={score,state,delta:score-old,x}})}
function advance(n){let k=0;while(k<n&&sim()){k++}$('latest').textContent=S.match>=34?'Season complete · summer window next.':'Simulated '+k+' match'+(k===1?'':'es')+' · '+S.match+'/34';render()}
function dh(v){if(v===undefined)return '';return '<span class="'+(v>0?'up':v<0?'down':'muted')+'">'+(v>0?'+':'')+v.toFixed(2)+'</span>'}
function render(){let avg=S.grades.length?(S.grades.reduce((a,b)=>a+b,0)/S.grades.length).toFixed(2):'—';$('identity').textContent=P.name+' · '+P.age+' · '+P.pos;$('clubline').textContent=S.club+' · '+S.contract.role+' · '+money(S.contract.wage);$('apps').textContent=S.apps;$('mins').textContent=S.mins;$('grade').textContent=avg;$('goals').textContent=S.goals;$('assists').textContent=S.assists;$('ability').textContent=ability().toFixed(1);$('matchesTab').innerHTML=S.hist.length?'<table><tr><th>#</th><th>Role</th><th>Min</th><th>Note</th><th>G/A</th></tr>'+S.hist.map(x=>'<tr><td>'+x.m+'</td><td>'+x.role+'</td><td>'+x.mins+'</td><td>'+x.grade+'</td><td>'+x.g+'/'+x.as+'</td></tr>').join('')+'</table>':'<p class="muted">No matches yet.</p>';let mk=Object.entries(S.market).sort((a,b)=>b[1].score-a[1].score);$('marketTab').innerHTML=mk.length?'<table><tr><th>Club</th><th>Score</th><th>Δ</th><th>State</th><th>Trigger</th></tr>'+mk.map(([n,v])=>'<tr><td>'+n+'</td><td>'+v.score.toFixed(1)+'</td><td>'+dh(v.delta)+'</td><td>'+v.state+'</td><td>'+v.x.toFixed(1)+'</td></tr>').join('')+'</table>':'<p class="muted">Simulate a match to generate scouting.</p>';let r=snap();$('ratingsTab').innerHTML='<table><tr><th>Rating</th><th>Value</th><th>Last Δ</th></tr>'+Object.entries(r).map(([k,v])=>'<tr><td>'+k+'</td><td>'+v.toFixed(2)+'</td><td>'+dh(S.delta?.[k])+'</td></tr>').join('')+'</table>';$('contractTab').innerHTML='<div class="offer"><h3>'+S.club+'</h3><p><b>Role:</b> '+S.contract.role+'<br><b>Expectation:</b> '+S.contract.expect+'<br><b>Playing time:</b> '+S.contract.minutes+'<br><b>Salary:</b> '+money(S.contract.wage)+'<br><b>Length:</b> '+S.contract.years+' years</p></div>'}
function tab(n,b){['matches','market','ratings','contract'].forEach(x=>$(x+'Tab').classList.toggle('hidden',x!==n));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
</script></body></html>
