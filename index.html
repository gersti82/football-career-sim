<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Football Career Simulator</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f7f8fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:820px;margin:auto;padding:18px 14px 40px}.card{background:#151b2d;border:1px solid #26304a;border-radius:18px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#20283d;border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:18px}.stat span,.muted,label{color:#9aa4ba;font-size:12px}input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #34415f;background:#0d1425;color:#fff;font-size:16px}label{display:block;margin:9px 0 5px}button{width:100%;border:0;border-radius:13px;padding:13px;margin-top:9px;font-weight:700;font-size:15px;background:#67e8f9;color:#06212a}.secondary{background:#27324a;color:#fff}.hidden{display:none}.offer{border:1px solid #34415f;border-radius:15px;padding:13px;margin:10px 0}.offer h3{margin:0 0 4px}.tag{display:inline-block;padding:5px 8px;border-radius:99px;background:#24304a;font-size:11px;margin:4px 3px 3px 0}.tabs{display:flex;gap:6px;overflow:auto}.tabs button{width:auto;white-space:nowrap;background:#27324a;color:#fff;padding:9px}.tabs .active{background:#67e8f9;color:#06212a}table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:7px 3px;border-bottom:1px solid #29334a;text-align:left}.up{color:#86efac}.down{color:#fca5a5}.headline{font-size:19px;font-weight:800}.event{border-left:3px solid #67e8f9;padding-left:10px;margin:10px 0}h1{font-size:25px;margin:4px 0}.sub{color:#9aa4ba;font-size:13px}.scroll{overflow-x:auto}</style></head><body><div class="wrap"><h1>Football Career Simulator</h1><div class="sub">Prototype 0.6 · 2016/17 historical fixtures · role/trust + event impact · DEBUG</div><div id="load" class="card">Loading historical 2016/17 Bundesliga…</div><div id="setup" class="card hidden"><div class="headline">Create player</div><div class="grid"><div><label>Name</label><input id="name" value="Chris"></div><div><label>Age</label><select id="age"><option selected>16</option><option>17</option><option>18</option><option>19</option><option>20</option></select></div><div><label>Position</label><select id="pos"><option>ST</option><option selected>AM</option><option>CM</option><option>DM</option><option>CB</option><option>FB</option><option>GK</option></select></div><div><label>Profile</label><select id="profile"><option value="balanced">Balanced prospect</option><option value="technical">Technical / creative</option><option value="physical">Athletic</option><option value="mental">Intelligent / composed</option></select></div></div><button onclick="generateOffers()">See contract offers</button></div><div id="offers" class="card hidden"></div><div id="game" class="hidden"><div class="card"><div id="identity" class="headline"></div><div id="clubline" class="muted"></div><div class="stats"><div class="stat"><b id="apps">0</b><span>Apps</span></div><div class="stat"><b id="mins">0</b><span>Minutes</span></div><div class="stat"><b id="grade">—</b><span>Kicker avg</span></div><div class="stat"><b id="goals">0</b><span>Goals</span></div><div class="stat"><b id="assists">0</b><span>Assists</span></div><div class="stat"><b id="ability">—</b><span>Ability debug</span></div></div></div><div class="card"><div class="headline">Simulate</div><div class="grid"><button onclick="advance(1)">Next match</button><button onclick="advance(5)">5 matches</button></div><button class="secondary" onclick="advance(99)">Rest of season</button><div id="latest" class="event muted">Ready.</div></div><div class="card"><div class="tabs"><button class="active" onclick="tab('matches',this)">Matches</button><button onclick="tab('team',this)">Team stats</button><button onclick="tab('market',this)">Interest debug</button><button onclick="tab('ratings',this)">Ratings debug</button><button onclick="tab('contract',this)">Contract</button></div><div id="matchesTab"></div><div id="teamTab" class="hidden"></div><div id="marketTab" class="hidden"></div><div id="ratingsTab" class="hidden"></div><div id="contractTab" class="hidden"></div></div><button class="secondary" onclick="location.reload()">New career</button></div></div><script>
const DATA='https://raw.githubusercontent.com/openfootball/deutschland/master/2016-17/1-bundesliga.txt';
const ALIAS={'Bayern München':'Bayern Munich','RB Leipzig':'RB Leipzig','Borussia Dortmund':'Borussia Dortmund','1899 Hoffenheim':'Hoffenheim','1. FC Köln':'FC Cologne','Hertha BSC':'Hertha Berlin','SC Freiburg':'Freiburg','Werder Bremen':'Werder Bremen','Bor. Mönchengladbach':'Borussia Monchengladbach','FC Schalke 04':'Schalke 04','Eintracht Frankfurt':'Eintracht Frankfurt','Bayer Leverkusen':'Bayer Leverkusen','FC Augsburg':'Augsburg','Hamburger SV':'Hamburg','1. FSV Mainz 05':'Mainz 05','VfL Wolfsburg':'Wolfsburg','FC Ingolstadt 04':'Ingolstadt','SV Darmstadt 98':'Darmstadt 98'};
const CLUBS={'Bayern Munich':[96,96,100,58],'RB Leipzig':[88,83,83,78],'Borussia Dortmund':[92,91,97,70],'Hoffenheim':[85,78,72,82],'FC Cologne':[80,74,76,76],'Hertha Berlin':[79,75,80,72],'Freiburg':[78,70,70,88],'Werder Bremen':[77,76,82,74],'Borussia Monchengladbach':[83,80,84,74],'Schalke 04':[84,83,91,70],'Eintracht Frankfurt':[79,73,78,78],'Bayer Leverkusen':[85,84,88,72],'Augsburg':[73,66,65,82],'Hamburg':[74,74,86,68],'Mainz 05':[74,68,68,84],'Wolfsburg':[77,78,82,71],'Ingolstadt':[68,61,52,87],'Darmstadt 98':[64,58,55,90],'Hannover 96':[70,65,70,80],'VfB Stuttgart':[73,68,76,82],'1860 Munich':[62,58,66,86],'Nurnberg':[66,61,68,84],'Bochum':[63,58,61,83],'Kaiserslautern':[63,59,67,82]};
const ROLE={"First-team player":{trust:52,boost:10,grade:2.9},"Squad player":{trust:40,boost:5,grade:3.2},"Rotation prospect":{trust:30,boost:0,grade:3.5},"Development prospect":{trust:20,boost:-5,grade:3.8}};let FIX=[],P=null,S=null,OFFERS=[];const $=x=>document.getElementById(x),clamp=(x,a=0,b=100)=>Math.max(a,Math.min(b,x));function rn(){let u=Math.random()||.1,v=Math.random()||.1;return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}function ability(){return P.t*.42+P.ph*.25+P.m*.33}function money(n){return '€'+Math.round(n/50)*50+'/week'}
function parse(t){let md=0,o=[];for(let raw of t.split(/\r?\n/)){let z=raw.match(/Matchday\s+(\d+)/i);if(z){md=+z[1];continue}let x=raw.match(/^\s*(?:\d{1,2}:\d{2}\s+)?(.+?)\s{2,}v\s+(.+?)\s{2,}(\d+)-(\d+)(?:\s|$)/);if(x&&ALIAS[x[1].trim()]&&ALIAS[x[2].trim()])o.push({md,home:ALIAS[x[1].trim()],away:ALIAS[x[2].trim()],hg:+x[3],ag:+x[4]})}return o}fetch(DATA,{cache:'no-store'}).then(r=>r.text()).then(t=>{FIX=parse(t);if(FIX.length!==306)throw Error('Only '+FIX.length+' fixtures parsed');$('load').innerHTML='<b class="up">Historical data loaded</b><div class="muted">306 Bundesliga matches · real opponents and results</div>';$('setup').classList.remove('hidden')}).catch(e=>$('load').innerHTML='Historical data error: '+e.message);
function generateOffers(){let base=67+Math.random()*7,pr=$('profile').value,t=base,ph=base,m=base;if(pr==='technical'){t+=5;ph-=2;m+=2}if(pr==='physical'){ph+=5;t-=1}if(pr==='mental'){m+=5;ph-=1}P={name:$('name').value||'Player',age:+$('age').value,pos:$('pos').value,t,ph,m,pot:clamp(base+13+Math.random()*12,74,97),prof:55+Math.random()*35,form:50,conf:50,trust:25,rep:8,att:5,fit:100};let a=ability(),pool=Object.entries(CLUBS).map(([n,c])=>({n,c,score:55-Math.abs(a-c[1])*1.5+c[3]*.18+(P.age<=18?c[3]*.1:0)+rn()*12})).sort((a,b)=>b.score-a.score).slice(0,11);OFFERS=[];while(OFFERS.length<4&&pool.length){let z=pool.splice(Math.floor(Math.random()*pool.length),1)[0],gap=a-z.c[1],role=gap>7?'First-team player':gap>1?'Squad player':gap>-6?'Rotation prospect':'Development prospect',minutes=role==='First-team player'?'Regular starts expected':role==='Squad player'?'Compete for regular minutes':role==='Rotation prospect'?'Bench chances; earn league minutes':'No immediate first-team promise',years=P.age<=18?3:3+(Math.random()<.5?0:1),wage=500+z.c[2]*18+(role==='First-team player'?700:role==='Squad player'?350:0)+Math.random()*500;OFFERS.push({club:z.n,role,minutes,years,wage,expect:role==='First-team player'?'Immediate contribution':role==='Squad player'?'Push established players':role==='Rotation prospect'?'Show progress when selected':'Develop patiently'})}$('setup').classList.add('hidden');$('offers').classList.remove('hidden');$('offers').innerHTML='<div class="headline">Your offers</div>'+OFFERS.map((o,i)=>'<div class="offer"><h3>'+o.club+'</h3><span class="tag">'+o.role+'</span><span class="tag">'+o.years+' years</span><span class="tag">'+money(o.wage)+'</span><p><b>Expectation:</b> '+o.expect+'<br><b>Playing time:</b> '+o.minutes+'</p><button onclick="sign('+i+')">Sign with '+o.club+'</button></div>').join('')}
function sign(i){let o=OFFERS[i];P.trust=ROLE[o.role].trust;let fx=FIX.filter(f=>f.home===o.club||f.away===o.club);S={club:o.club,contract:o,fx,match:0,apps:0,starts:0,mins:0,goals:0,assists:0,grades:[],hist:[],market:{},delta:{},team:{p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0},lastRoleDelta:0,lastRoleText:'No match yet'};$('offers').classList.add('hidden');$('load').classList.add('hidden');$('game').classList.remove('hidden');render()}
function snap(){return {ability:ability(),technical:P.t,physical:P.ph,mental:P.m,potential:P.pot,professionalism:P.prof,form:P.form,confidence:P.conf,trust:P.trust,reputation:P.rep,attention:P.att,fitness:P.fit}}
function roleTrustDelta(grade,g,as,played){let r=ROLE[S.contract.role];if(!played){S.lastRoleText='Not selected — no performance judgement';return 0}let performance=(r.grade-grade)*1.8,event=g*1.25+as*.65,ageBonus=P.age<=17?(g*0.55+as*.25):0,d=performance+event+(P.prof-70)*.003;S.lastRoleText='Grade '+grade.toFixed(1)+' vs expected '+r.grade.toFixed(1)+(g?' · goal +'+(1.25+(P.age<=17?.55:0)).toFixed(2):'')+(as?' · assist bonus':'')+' · minutes do not affect trust';return d}
function sim(){if(S.match>=S.fx.length)return false;let before=snap(),f=S.fx[S.match],home=f.home===S.club,opp=home?f.away:f.home,gf=home?f.hg:f.ag,ga=home?f.ag:f.hg,c=CLUBS[S.club],r=ROLE[S.contract.role],gap=ability()-c[1],sel=clamp(25+gap*1.8+P.trust*.55+r.boost+(P.form-50)*.18+(P.fit-80)*.08,2,96),play=Math.random()*100<sel,started=play&&Math.random()*100<clamp(sel-12,3,88),mins=play?Math.round(clamp(started?76+rn()*13:20+rn()*10,5,90)):0,perf=play?clamp(50+gap*.45+(P.form-50)*.15+rn()*12):0,baseGrade=play?clamp(6-perf/20,1,6):null,g=play&&Math.random()<Math.max(.025,(4-baseGrade)*.07)?1:0,as=play&&Math.random()<Math.max(.03,(4-baseGrade)*.08)?1:0;
let eventBonus=g*(P.age<=17?.85:.65)+as*.35;let grade=play?Math.round(clamp(baseGrade-eventBonus,1,6)*2)/2:null;if(play){S.apps++;S.starts+=started;S.mins+=mins;S.goals+=g;S.assists+=as;S.grades.push(grade);P.form=clamp(P.form*.78+(perf+g*9+as*5)*.22);P.conf=clamp(P.conf+(3.5-grade)*1.2+g*.8);S.lastRoleDelta=roleTrustDelta(grade,g,as,true);P.trust=clamp(P.trust+S.lastRoleDelta);let impact=Math.max(0,4.2-grade)*1.1+g*2.8+as*1.4,ageSpot=P.age<=17?(g*1.8+as*.7):0,exposure=c[2]/100*(impact+ageSpot);P.att=clamp(P.att+exposure*1.35);P.rep=clamp(P.rep+exposure*.62);P.fit=clamp(P.fit-mins/15+3)}else{S.lastRoleDelta=0;S.lastRoleText='Not selected — no trust penalty';P.form=clamp(P.form-.5+Math.random());P.fit=clamp(P.fit+3)}let tm=S.team;tm.p++;tm.gf+=gf;tm.ga+=ga;if(gf>ga){tm.w++;tm.pts+=3}else if(gf===ga){tm.d++;tm.pts++}else tm.l++;let room=Math.max(0,P.pot-ability()),dev=(P.age<=20?.20:.11)*(.5+c[0]/150)*(P.prof/75)*(.3+room/30)*(play?.9:.55);P.t+=dev*.4;P.ph+=dev*.25;P.m+=dev*.35;S.match++;S.hist.unshift({md:f.md,opp,venue:home?'H':'A',result:gf+'-'+ga,role:play?(started?'Start':'Sub'):'Not selected',mins,grade:grade?grade.toFixed(1):'—',g,as,trust:S.lastRoleDelta,why:S.lastRoleText});market(grade,g,as,c);let after=snap();S.delta={};Object.keys(after).forEach(k=>S.delta[k]=after[k]-before[k]);return true}
function market(grade,g,as,c){let perf=grade?Math.max(0,4.2-grade)*11+g*13+as*6:0,young=P.age<=17?(g*10+as*4+Math.max(0,3.5-(grade||4))*5):0,signal=P.att*.45+P.rep*.3+perf+young+c[2]*.17;Object.entries(CLUBS).forEach(([n,cc])=>{if(n===S.club)return;let old=S.market[n]?.score||0,fit=95-Math.abs(cc[1]-ability())*2.1,x=signal*.43+(88-cc[1])*.18+fit*.25+Math.max(0,ability()+P.rep*.2+P.att*.15-cc[1]+10)*.2+rn()*7,score=clamp(old*.94+Math.max(0,x-18)*.17),state=score>42?'Serious interest':score>30?'Interested':score>18?'Scouting':score>8?'Monitoring':'Aware';S.market[n]={score,state,delta:score-old,x}})}
function advance(n){let k=0;while(k<n&&sim())k++;let x=S.hist[0];$('latest').innerHTML=x?'<b>MD '+x.md+': '+S.club+' '+x.result+' '+x.opp+' ('+x.venue+')</b><br>'+x.role+(x.mins?' · '+x.mins+' min':'')+(x.grade!=='—'?' · Kicker '+x.grade:'')+(x.g?' · ⚽ '+x.g:'')+(x.as?' · assist '+x.as:''):'Ready';render()}
function dh(v){if(v===undefined)return '';return '<span class="'+(v>0?'up':v<0?'down':'muted')+'">'+(v>0?'+':'')+v.toFixed(2)+'</span>'}
function render(){let avg=S.grades.length?(S.grades.reduce((a,b)=>a+b,0)/S.grades.length).toFixed(2):'—',r=ROLE[S.contract.role];$('identity').textContent=P.name+' · '+P.age+' · '+P.pos;$('clubline').textContent=S.club+' · '+S.contract.role+' · '+money(S.contract.wage);$('apps').textContent=S.apps;$('mins').textContent=S.mins;$('grade').textContent=avg;$('goals').textContent=S.goals;$('assists').textContent=S.assists;$('ability').textContent=ability().toFixed(1);$('matchesTab').innerHTML=S.hist.length?'<div class="scroll"><table><tr><th>MD</th><th>Opponent</th><th>Res</th><th>Role</th><th>Min</th><th>Note</th><th>G/A</th><th>Trust Δ</th></tr>'+S.hist.map(x=>'<tr><td>'+x.md+'</td><td>'+x.venue+' '+x.opp+'</td><td>'+x.result+'</td><td>'+x.role+'</td><td>'+x.mins+'</td><td>'+x.grade+'</td><td>'+x.g+'/'+x.as+'</td><td>'+dh(x.trust)+'</td></tr>').join('')+'</table></div><div class="event muted">'+S.hist[0].why+'</div>':'<p class="muted">No matches yet.</p>';let t=S.team;$('teamTab').innerHTML='<div class="stats"><div class="stat"><b>'+t.p+'</b><span>Played</span></div><div class="stat"><b>'+t.pts+'</b><span>Points</span></div><div class="stat"><b>'+t.w+'-'+t.d+'-'+t.l+'</b><span>W-D-L</span></div><div class="stat"><b>'+t.gf+':'+t.ga+'</b><span>Goals</span></div><div class="stat"><b>'+(t.gf-t.ga>0?'+':'')+(t.gf-t.ga)+'</b><span>Goal diff</span></div><div class="stat"><b>'+(t.p?(t.pts/t.p).toFixed(2):'—')+'</b><span>Pts/game</span></div></div>';let mk=Object.entries(S.market).sort((a,b)=>b[1].score-a[1].score);$('marketTab').innerHTML=mk.length?'<div class="scroll"><table><tr><th>Club</th><th>Score</th><th>Δ</th><th>State</th><th>Trigger</th></tr>'+mk.map(([n,v])=>'<tr><td>'+n+'</td><td>'+v.score.toFixed(1)+'</td><td>'+dh(v.delta)+'</td><td>'+v.state+'</td><td>'+v.x.toFixed(1)+'</td></tr>').join('')+'</table></div>':'<p class="muted">Simulate a match.</p>';let rr=snap();$('ratingsTab').innerHTML='<div class="offer"><b>Role model</b><br>Trust baseline '+r.trust+' · selection boost '+r.boost+' · expected grade '+r.grade.toFixed(1)+'<br><b>Trust:</b> performance + goals/assists + professionalism. Playing minutes: 0 weight.</div><table><tr><th>Rating</th><th>Value</th><th>Last Δ</th></tr>'+Object.entries(rr).map(([k,v])=>'<tr><td>'+k+'</td><td>'+v.toFixed(2)+'</td><td>'+dh(S.delta?.[k])+'</td></tr>').join('')+'</table>';$('contractTab').innerHTML='<div class="offer"><h3>'+S.club+'</h3><p><b>Role:</b> '+S.contract.role+'<br><b>Expectation:</b> '+S.contract.expect+'<br><b>Playing time:</b> '+S.contract.minutes+'<br><b>Salary:</b> '+money(S.contract.wage)+'<br><b>Length:</b> '+S.contract.years+' years<br><b>Manager trust:</b> '+P.trust.toFixed(1)+'</p></div>'}
function tab(n,b){['matches','team','market','ratings','contract'].forEach(x=>$(x+'Tab').classList.toggle('hidden',x!==n));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}</script></body></html>
